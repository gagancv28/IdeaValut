<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23deff9a'/><path d='M16 6L10 18h4v8l8-14h-4z' fill='%230f172a'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Anti-FOUC: apply saved theme class before React hydrates -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('ideavault-theme');
          if (t === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
    <meta name="description" content="IdeaVault — India's first zero-brokerage startup & investor matchmaking directory. Discover early-stage startups, connect directly with founders, and invest without middlemen." />
    <meta name="keywords" content="startup investment, India startups, investor directory, early stage funding, angel investing, startup listing" />
    <meta property="og:title" content="IdeaVault — Direct-Contact Startup & Investor Directory" />
    <meta property="og:description" content="Zero brokerage. Direct founder access. Discover India's most promising early-stage startups." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <title>IdeaVault — Startup & Investor Matchmaking Directory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
